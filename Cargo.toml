[workspace]
resolver = "3"
members = ["fairlane", "fairlane-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# hybrid-array 0.4's floor, and edition 2024's.
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/al8n/fairlane"
homepage = "https://github.com/al8n/fairlane"
readme = "README.md"
keywords = ["channel", "mpmc", "priority", "async", "lanes"]
categories = ["concurrency", "asynchronous", "data-structures"]

[workspace.dependencies]
fairlane = { version = "0.1", path = "fairlane", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)', 'cfg(loom)'] }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false
